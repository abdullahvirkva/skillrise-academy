<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Courses — SkillRise Academy</title>
<meta name="description" content="Browse all 52 video courses at SkillRise Academy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page-hero"><div class="wrap">
<h1>All 52 Courses</h1>
<p>Every course is 100% video — watch, practice, and build real projects.</p>
<div class="searchbar"><input id="q" placeholder="Search courses… (e.g. video, design, SEO)" oninput="render()"></div>
</div></div>
<section style="padding-top:40px"><div class="wrap">
<div class="pills" id="pills"></div>
<div class="fgrid" id="grid" style="grid-template-columns:repeat(2,1fr)"></div>
<div class="count-note" id="countNote"></div>
</div></section>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
let activeCat='All';
function pageInit(){
  const box=document.getElementById('pills');
  ['All',...CATS].forEach(c=>{
    const b=document.createElement('button');b.className='pill'+(c==='All'?' on':'');b.textContent=c==='All'?'All Courses':c;
    b.onclick=()=>{activeCat=c;[...box.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
    box.appendChild(b);
  });
  render();
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const list=COURSES.filter(c=>(activeCat==='All'||c.cat===activeCat)&&(!q||c.name.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=list.map(courseCard).join('');
  document.getElementById('countNote').textContent=`Showing ${list.length} of ${COURSES.length} courses`;
  initReveal();
}
</script>
</body>
</html>
