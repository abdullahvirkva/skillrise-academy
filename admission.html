<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Admission — SkillRise Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page-hero"><div class="wrap">
<h1>Apply for Admission</h1>
<p>Fill in the form — we confirm your seat and send payment instructions within 24 hours.</p>
</div></div>
<section><div class="wrap">
<div class="form-card" id="adPage">
<h2>Admission Form</h2>
<p style="color:#5b6478;font-size:14px;margin:6px 0 22px">2026 batch · limited seats per course</p>
<div class="field"><label>Full Name *</label><input id="pName" placeholder="Your full name"></div>
<div class="field"><label>Email *</label><input id="pEmail" type="email" placeholder="you@example.com"></div>
<div class="field"><label>Choose Plan / Course *</label><select id="pCourse"></select></div>
<div class="field"><label>Payment Method *</label>
<div class="pay-methods">
<div class="paym on" data-v="Card">💳 Card</div>
<div class="paym" data-v="Bank transfer">🏦 Bank transfer</div>
</div></div>
<button class="btn btn-p" style="width:100%" onclick="submitPage()">Submit Application</button>
<p style="font-size:13px;color:#9aa3b5;margin-top:14px;text-align:center">30-day money-back guarantee · No hidden fees</p>
</div>
<div class="form-card okmsg" id="adPageOk" style="display:none">
<div class="big-ok">✓</div><h2>Application Received!</h2>
<p style="color:#5b6478" id="adPageMsg"></p>
<div style="background:var(--soft);border-radius:14px;padding:20px;margin-top:18px;text-align:left;font-size:14px;color:#3d4659" id="payInfo"></div>
<a class="btn btn-p" style="margin-top:20px" href="courses.html">Browse Courses</a>
</div>
</div></section>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
let payMethod='Card';
function pageInit(){
  const sel=document.getElementById('pCourse');
  const pre=new URLSearchParams(location.search).get('course');
  const o0=document.createElement('option');o0.textContent='All-Access Pass — all 52 courses ($99)';sel.appendChild(o0);
  COURSES.forEach(c=>{const o=document.createElement('option');o.textContent=`${c.name} — $${c.price}`;sel.appendChild(o);});
  if(pre){[...sel.options].forEach(o=>{if(o.text.indexOf(pre)===0)sel.value=o.text;});}
  document.querySelectorAll('.paym').forEach(m=>m.onclick=()=>{document.querySelectorAll('.paym').forEach(x=>x.classList.remove('on'));m.classList.add('on');payMethod=m.dataset.v;});
}
function submitPage(){
  const n=document.getElementById('pName').value.trim(),e=document.getElementById('pEmail').value.trim();
  if(!n||!e||e.indexOf('@')<0){alert('Please fill your name and a valid email.');return;}
  const course=document.getElementById('pCourse').value;
  document.getElementById('adPageMsg').textContent=`Thanks ${n}! Your seat for "${course}" is reserved.`;
  document.getElementById('payInfo').innerHTML=`<b>Next step — payment (${payMethod}):</b><br>We have sent payment instructions to <b>${e}</b>. Once paid, your course access is activated instantly and your login details are emailed to you.`;
  document.getElementById('adPage').style.display='none';
  document.getElementById('adPageOk').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
