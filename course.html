<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — SkillRise Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<section style="padding:46px 0 70px"><div class="wrap" id="detail"></div></section>
<section style="background:#fafbff;padding-top:56px"><div class="wrap">
<div class="sec-head"><div class="kicker">Keep Learning</div><h2>Related Courses</h2></div>
<div class="fgrid" id="related" style="grid-template-columns:repeat(2,1fr)"></div>
</div></section>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
function pageInit(){
  const c = courseById(new URLSearchParams(location.search).get('id'));
  const box = document.getElementById('detail');
  if(!c){ box.innerHTML = `<div class="form-card" style="text-align:center"><h2>Course not found</h2><p style="color:#5b6478;margin:10px 0 20px">This course doesn't exist.</p><a class="btn btn-p" href="courses.html">Browse all courses</a></div>`; return; }
  document.title = c.name + ' — SkillRise Academy';
  const lv = (typeof LESSON_VIDEOS!=='undefined' && LESSON_VIDEOS[c.id]) || {};
  const syl = syllabus(c).map((l,n)=>{
    const v = lv[n+1];
    const tag = v
      ? `<span class="lp" style="cursor:pointer;color:var(--p);font-weight:800" onclick="openVideo('${v}','${c.name} — Lesson ${n+1}')">▶ Play lesson</span>`
      : `<span class="lp">▶ ${l.d}</span>`;
    return `<li><b>Lesson ${n+1}</b> ${l.t}${tag}</li>`;
  }).join('');
  box.innerHTML = `
  <div class="crumb"><a href="index.html">Home</a> / <a href="courses.html">Courses</a> / ${c.name}</div>
  <div class="detail-grid">
    <div class="detail-main">
      <div style="position:relative;cursor:pointer" onclick="openVideo('${c.video}','${c.name} — Free Preview')">
        <img class="cover" src="${c.img}" alt="${c.name}">
        <div class="fplay"><span></span></div>
      </div>
      <div style="margin-top:22px"><span class="fcat" style="font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--p)">${c.cat}</span>
      <h1 style="font-size:38px;margin:8px 0">${c.name}</h1>
      <div class="fmeta" style="font-size:14.5px;color:#5b6478;display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 14px"><span><span class="st" style="color:var(--gold)">★★★★★</span> ${c.rating} rating</span><span>${c.lessons} video lessons</span><span>${c.hours} hours</span><span>${c.level}</span></div>
      <p style="font-size:16.5px;color:#3d4659">${c.desc}</p></div>
      <h2 style="font-size:24px;color:var(--ink);margin:30px 0 6px">What you'll learn</h2>
      <ul class="syl-list">${syl}</ul>
      <div class="center" style="margin-top:28px"><button class="btn btn-o" onclick="openVideo('${c.video}','${c.name} — Free Preview')">▶ Watch Free Preview</button></div>
    </div>
    <div class="price-card">
      ${c.badge?`<span class="ribbon" style="position:static;display:inline-block;margin-bottom:14px">${c.badge}</span>`:''}
      <div class="pprice">$${c.price} <s>$${c.old}</s></div>
      <p style="color:#5b6478;font-size:14px;margin:6px 0 18px">One-time payment · lifetime access</p>
      <button class="btn btn-p" style="width:100%;margin-bottom:10px" onclick="enroll('${c.name}')">Enroll Now</button>
      <button class="btn btn-o" style="width:100%" onclick="openModal('admitModal')">Apply for Admission</button>
      <ul class="inclist">
        <li><i>✓</i> ${c.lessons} video lessons (${c.hours}h)</li>
        <li><i>✓</i> Certificate of completion</li>
        <li><i>✓</i> 30-day money-back guarantee</li>
        <li><i>✓</i> Lifetime access + updates</li>
      </ul>
    </div>
  </div>`;
  document.getElementById('related').innerHTML = COURSES.filter(x=>x.cat===c.cat&&x.id!==c.id).slice(0,4).map(courseCard).join('');
  initReveal();
}
</script>
</body>
</html>
