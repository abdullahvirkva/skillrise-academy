<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — SkillRise Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="page-hero"><div class="wrap">
<h1>Student Account</h1>
<p>Login to continue learning, or create your free account.</p>
</div></div>
<section><div class="wrap">
<div class="form-card">
<div class="tabs">
<button class="tab on" id="tabLogin" onclick="showTab('login')">Login</button>
<button class="tab" id="tabSignup" onclick="showTab('signup')">Create Account</button>
</div>
<div id="paneLogin">
<div class="field"><label>Email</label><input type="email" id="lEmail" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input type="password" id="lPass" placeholder="••••••••"></div>
<button class="btn btn-p" style="width:100%" onclick="pageLogin()">Login</button>
</div>
<div id="paneSignup" style="display:none">
<div class="field"><label>Full Name</label><input id="sName" placeholder="Your name"></div>
<div class="field"><label>Email</label><input type="email" id="sEmail" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input type="password" id="sPass" placeholder="Choose a password (min 6 characters)"></div>
<button class="btn btn-p" style="width:100%" onclick="pageSignup()">Create Free Account</button>
</div>
<div class="okmsg" id="accOk" style="display:none">
<div class="big-ok">✓</div><h2 id="accTitle">Welcome!</h2>
<p style="color:#5b6478" id="accMsg"></p>
<a class="btn btn-p" style="margin-top:16px" href="courses.html">Browse Courses</a>
</div>
<p style="font-size:12.5px;color:#9aa3b5;margin-top:16px;text-align:center">Demo student portal — your account is saved in this browser.</p>
</div>
</div></section>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
function showTab(t){
  document.getElementById('tabLogin').classList.toggle('on',t==='login');
  document.getElementById('tabSignup').classList.toggle('on',t==='signup');
  document.getElementById('paneLogin').style.display=t==='login'?'block':'none';
  document.getElementById('paneSignup').style.display=t==='signup'?'block':'none';
}
function getUsers(){try{return JSON.parse(localStorage.getItem('sr_users')||'{}');}catch(e){return{};}}
function setUsers(u){localStorage.setItem('sr_users',JSON.stringify(u));}
function doneAcc(title,msg){
  document.getElementById('paneLogin').style.display='none';
  document.getElementById('paneSignup').style.display='none';
  document.querySelector('.tabs').style.display='none';
  document.getElementById('accTitle').textContent=title;
  document.getElementById('accMsg').textContent=msg;
  document.getElementById('accOk').style.display='block';
}
function pageSignup(){
  const n=document.getElementById('sName').value.trim(),e=document.getElementById('sEmail').value.trim().toLowerCase(),p=document.getElementById('sPass').value;
  if(!n||!e||e.indexOf('@')<0){alert('Please enter your name and a valid email.');return;}
  if(p.length<6){alert('Password must be at least 6 characters.');return;}
  const u=getUsers();
  if(u[e]){alert('This email already has an account — please login.');showTab('login');return;}
  u[e]={name:n,pass:p};setUsers(u);localStorage.setItem('sr_session',e);
  doneAcc('Account Created!',`Welcome, ${n}! Your free student account is ready. Now pick a course to start learning.`);
}
function pageLogin(){
  const e=document.getElementById('lEmail').value.trim().toLowerCase(),p=document.getElementById('lPass').value;
  const u=getUsers()[e];
  if(!u){alert('No account found for this email — please create one.');showTab('signup');return;}
  if(u.pass!==p){alert('Wrong password.');return;}
  localStorage.setItem('sr_session',e);
  doneAcc('Welcome back!',`Good to see you again, ${u.name}! Your courses are waiting.`);
}
function pageInit(){}
</script>
</body>
</html>
